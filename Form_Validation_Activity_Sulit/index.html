<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="card">
      <!-- 1. Initial Selection View -->
      <div id="selectionView" class="view">
        <header class="card-header text-center">
          <h2>Get Started</h2>
          <p>Choose an option below to proceed.</p>
        </header>

        <div class="selection-actions">
          <button type="button" id="btnChooseSignUp" class="btn btn-primary">Sign Up</button>
          <button type="button" id="btnChooseSignIn" class="btn btn-outline">Sign In</button>
        </div>
      </div>

      <!-- 2. Form View (Hidden by default) -->
      <div id="formView" class="view hidden">
        <header class="card-header">
          <h2 id="formTitle">Create Account</h2>
          <p id="formSubtext">Please fill out the form below to register.</p>
        </header>

        <div id="successAlert" class="alert success" hidden></div>

        <form id="authForm" novalidate>
          <!-- Username (Sign Up Only) -->
          <div class="form-group" id="group-username">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="e.g. jondoe" autocomplete="username">
            <small class="error-msg" id="error-username"></small>
          </div>

          <!-- Email (Both Modes) -->
          <div class="form-group" id="group-email">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="e.g. john@example.com" autocomplete="email">
            <small class="error-msg" id="error-email"></small>
          </div>

          <!-- Password (Both Modes) -->
          <div class="form-group" id="group-password">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="current-password">
            <small class="error-msg" id="error-password"></small>
          </div>

          <!-- Confirm Password (Sign Up Only) -->
          <div class="form-group" id="group-confirmPassword">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password">
            <small class="error-msg" id="error-confirmPassword"></small>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary">Register</button>
        </form>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
