<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video autoplay muted loop playsinline id="bgVideo">
    <source src="peace.mp4" type="video/mp4">
  </video>

  <main class="container">
    <div class="card">
      <!-- Initial Page Layout Structure -->
      <div id="selectionView" class="view">
        <header class="card-header text-center">
          <h2>Welcome!</h2>
          <p>Please choose an option to direct you to the appropriate form.</p>
        </header>

        <div class="selection-actions">
          <button type="button" id="btnChooseSignUp" class="btn btn-primary">Sign Up</button>
          <button type="button" id="btnChooseSignIn" class="btn btn-outline">Login</button>
        </div>
      </div>

      <!-- Form View -->
      <div id="formView" class="view hidden">
        <div class="form-navigation">
          <button type="button" id="backBtn" class="back-link">&larr; Back to Welcome</button>
        </div>

        <header class="card-header">
          <h2 id="formTitle">Sign Up</h2>
          <p id="formSubtext">Please fill out the details below.</p>
        </header>

        <div id="successAlert" class="alert success" hidden></div>

        <form id="authForm" novalidate>
          <!-- Email (Both Modes) -->
          <div class="form-group" id="group-email">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="e.g. john@example.com" autocomplete="email">
            <small class="error-msg" id="error-email"></small>
          </div>

          <!-- Phone Number (Sign Up Only) -->
          <div class="form-group" id="group-phone">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. 09123456789" autocomplete="tel">
            <small class="error-msg" id="error-phone"></small>
          </div>

          <!-- Password (Both Modes) -->
          <div class="form-group" id="group-password">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters with a number" autocomplete="current-password">
            <small class="error-msg" id="error-password"></small>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary">Sign Up</button>
        </form>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
