<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About Me</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 3rem auto; padding: 0 1rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .label { font-weight: bold; color: #555; margin-bottom: .2rem; }
    .value { margin-bottom: .8rem; font-size: 1.1rem; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; width: 100%; margin-top: .5rem; }
  </style>
</head>
<body>
  <h1>About Me</h1>
  <div class="card" id="profile-card">
    <div class="label">Username:</div>
    <div class="value" id="user-username">Loading...</div>

    <div class="label">Email:</div>
    <div class="value" id="user-email">Loading...</div>

    <div class="label">Bio:</div>
    <div class="value" id="user-bio">Loading...</div>
  </div>

  <a href="/dashboard.html"><button type="button">Back to Dashboard</button></a>
  <a href="/users.html"><button type="button">View All Users</button></a>
  <button id="logout" style="margin-top: 1rem;">Log out</button>

  <script>
    // check auth token in local storage
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "/index.html";

    // load about me profile
    async function loadAboutMe() {
      // call protected me route with bearer token
      const res = await fetch("/api/users/me", {
        headers: { Authorization: `Bearer ${token}` },
      });

      // handle expired or invalid token
      if (!res.ok) {
        localStorage.removeItem("token");
        window.location.href = "/index.html";
        return;
      }

      // render user details
      const user = await res.json();
      document.getElementById("user-username").textContent = user.username || user.name || "N/A";
      document.getElementById("user-email").textContent = user.email || "N/A";
      document.getElementById("user-bio").textContent = user.bio || "No bio provided";
    }

    // handle user logout
    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "/index.html";
    });

    loadAboutMe();
  </script>
</body>
</html>
