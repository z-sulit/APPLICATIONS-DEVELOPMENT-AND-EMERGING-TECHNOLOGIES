<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video autoplay muted loop playsinline id="bgVideo">
    <source src="peace.mp4" type="video/mp4">
  </video>

  <main class="container">
    <div class="card">
      <header class="card-header">
        <h2>Sign Up</h2>
        <p>Create an account by filling in the details below.</p>
      </header>

      <div id="alertBox" class="alert hidden"></div>

      <form id="signupForm" novalidate>
        <div class="form-group" id="group-email">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="e.g. john@example.com" autocomplete="email">
          <small class="error-msg" id="error-email"></small>
        </div>

        <div class="form-group" id="group-username">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="e.g. johndoe" autocomplete="username">
          <small class="error-msg" id="error-username"></small>
        </div>

        <div class="form-group" id="group-password">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password">
          <small class="error-msg" id="error-password"></small>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">Sign Up</button>
      </form>

      <div class="form-footer">
        <p>Already have an account? <a href="login.html">Log in here</a></p>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('signupForm');
    const emailInput = document.getElementById('email');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.classList.remove('hidden');
    }

    function clearAlert() {
      alertBox.textContent = '';
      alertBox.className = 'alert hidden';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const email = emailInput.value.trim();
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !username || !password) {
        showAlert('400 Bad Request: All fields (email, username, and password) are required.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing up...';

      try {
        const response = await fetch('/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, username, password })
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 201) {
          showAlert(`201 Created: ${data.message || 'Signup successful! Redirecting...'}`, 'success');
          sessionStorage.setItem('currentUser', JSON.stringify({ username, email }));
          setTimeout(() => {
            window.location.href = 'home.html';
          }, 1000);
        } else if (response.status === 409) {
          showAlert(`409 Conflict: ${data.message || 'User already exists.'}`, 'error');
        } else if (response.status === 400) {
          showAlert(`400 Bad Request: ${data.message || 'Empty fields are not allowed.'}`, 'error');
        } else {
          showAlert(`Error ${response.status}: ${data.message || 'Signup failed.'}`, 'error');
        }
      } catch (error) {
        showAlert('Network error: Could not reach the backend server.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign Up';
      }
    });
  </script>
</body>
</html>
