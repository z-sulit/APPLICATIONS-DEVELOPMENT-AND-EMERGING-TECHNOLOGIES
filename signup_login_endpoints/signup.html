<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video autoplay muted loop playsinline id="bgVideo">
    <source src="peace.mp4" type="video/mp4">
  </video>

  <main class="container">
    <div class="card">
      <header class="card-header">
        <h2>Sign Up</h2>
        <p>Create an account by filling in the details below.</p>
      </header>

      <div id="alertBox" class="alert hidden"></div>

      <form id="signupForm" novalidate>
        <div class="form-group" id="group-email">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="e.g. john@example.com" autocomplete="email">
          <small class="error-msg" id="error-email"></small>
        </div>

        <div class="form-group" id="group-username">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="e.g. johndoe" autocomplete="username">
          <small class="error-msg" id="error-username"></small>
        </div>

        <div class="form-group" id="group-password">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password">
          <small class="error-msg" id="error-password"></small>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">Sign Up</button>
      </form>

      <div class="form-footer">
        <p>Already have an account? <a href="login.html">Log in here</a></p>
      </div>
    </div>
  </main>

  <script src="scripts/script.js"></script>
</body>
</html>
