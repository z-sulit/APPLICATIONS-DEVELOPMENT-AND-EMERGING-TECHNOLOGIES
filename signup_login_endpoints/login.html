<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video autoplay muted loop playsinline id="bgVideo">
    <source src="peace.mp4" type="video/mp4">
  </video>

  <main class="container">
    <div class="card">
      <header class="card-header">
        <h2>Login</h2>
        <p>Enter your credentials to access your account.</p>
      </header>

      <div id="alertBox" class="alert hidden"></div>

      <form id="loginForm" novalidate>
        <div class="form-group" id="group-username">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">
          <small class="error-msg" id="error-username"></small>
        </div>

        <div class="form-group" id="group-password">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
          <small class="error-msg" id="error-password"></small>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">Login</button>
      </form>

      <div class="form-footer">
        <p>Don't have an account? <a href="index.html">Sign up here</a></p>
      </div>
    </div>
  </main>

  <script          
  src="scripts/script.js">
</script>
</body>
</html>
